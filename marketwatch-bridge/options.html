<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Glassbox MarketWatch Bridge</title>
    <style>
      :root { color: #132b20; background: #ecf2eb; font-family: Georgia, serif; }
      body { max-width: 640px; margin: 48px auto; padding: 0 24px; }
      h1 { font-size: 2rem; margin-bottom: 0.25rem; }
      label { display: block; font-weight: bold; margin-top: 20px; }
      input { box-sizing: border-box; width: 100%; margin-top: 6px; padding: 10px; border: 1px solid #789480; border-radius: 4px; font: 15px ui-monospace, monospace; }
      button { margin-top: 24px; padding: 10px 16px; color: #fff; background: #176b43; border: 0; border-radius: 4px; font: bold 15px Georgia, serif; cursor: pointer; }
      #status { min-height: 1.4em; margin-top: 16px; font-family: ui-monospace, monospace; }
      .note { color: #405647; line-height: 1.5; }
    </style>
  </head>
  <body>
    <h1>Glassbox Bridge</h1>
    <p class="note">This extension only reads the visible Wolves Portfolio and activity tables. It never clicks, submits, or changes a MarketWatch order. Use the local endpoint unless Glassbox is intentionally hosted elsewhere.</p>
    <label for="endpoint">Bridge endpoint</label>
    <input id="endpoint" type="url" placeholder="http://127.0.0.1:8765" autocomplete="off">
    <label for="token">Bridge token</label>
    <input id="token" type="password" minlength="32" autocomplete="new-password">
    <button id="save" type="button">Save secure bridge settings</button>
    <p id="status" role="status"></p>
    <script src="options.js"></script>
  </body>
</html>
